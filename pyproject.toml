[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "periodicool"
dynamic = ["version"]
description = "Self-hosted *arr-style manager for magazines."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.158.1",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.1.6",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://github.com/electrichobo/periodicool"

[tool.setuptools.dynamic]
version = { attr = "periodicool.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"periodicool.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]
