# Example PeriodiCool stack. Adjust the host paths on the left of each volume.
# Keep the API keys in a .env file next to this file (never commit it):
#   PROWLARR_API_KEY=...
#   SABNZBD_API_KEY=...

services:
  periodicool:
    image: ghcr.io/electrichobo/periodicool:latest
    container_name: periodicool
    restart: unless-stopped
    ports:
      - "8383:8383"
    environment:
      PUID: "99"        # Unraid's nobody user; use your own on other systems
      PGID: "100"       # Unraid's users group
      UMASK: "002"
      TZ: "Etc/UTC"     # your time zone, for example America/Los_Angeles
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY}
      # The download client's downloads, mounted exactly as the client (and Sonarr
      # or Radarr) sees them, so no path mapping is needed.
      PERIODICOOL_DOWNLOADS_DIR: /data
      # PERIODICOOL_IMPORT_DIR: /import   # optional drop-in folder
    volumes:
      - /path/to/appdata/periodicool:/config
      - /path/to/magazines:/library
      # Same host folder and container path as in the download client's own stack.
      # Mount an existing folder: Docker creates a missing one owned by root, and
      # the download client then cannot write into it.
      - /path/to/downloads:/data
      # - /path/to/magazine-dropbox:/import
