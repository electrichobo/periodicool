name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install
        run: pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: periodicool:ci
      - name: Start container as 1234:1234
        run: |
          mkdir -p /tmp/pc/config /tmp/pc/library /tmp/pc/downloads
          docker run -d --name pc -p 8383:8383 \
            -e PUID=1234 -e PGID=1234 -e TZ=America/Los_Angeles \
            -v /tmp/pc/config:/config -v /tmp/pc/library:/library -v /tmp/pc/downloads:/downloads \
            periodicool:ci
      - name: Health endpoint answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8383/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: App runs as 1234, not root
        run: |
          # The entrypoint execs into the app, so PID 1 is PeriodiCool itself.
          docker exec pc cat /proc/1/cmdline | tr '\0' ' '; echo
          docker exec pc grep -E '^(Uid|Gid):' /proc/1/status
          test "$(docker exec pc awk '/^Uid:/ {print $2 $3 $4 $5}' /proc/1/status)" = "1234123412341234"
          test "$(docker exec pc awk '/^Gid:/ {print $2 $3 $4 $5}' /proc/1/status)" = "1234123412341234"
      - name: Database owned by 1234
        run: test "$(stat -c %u /tmp/pc/config/periodicool.db)" = "1234"
      - name: Container log as annotations (on failure)
        if: failure()
        run: |
          annotate() {
            local text="$2"
            text="${text//'%'/'%25'}"; text="${text//$'\r'/'%0D'}"; text="${text//$'\n'/'%0A'}"
            echo "::error title=$1::$text"
          }
          annotate "docker ps" "$(docker ps -a 2>&1)"
          annotate "container log" "$(docker logs pc 2>&1 | tail -60)"
          annotate "process 1" "$(docker exec pc grep -E "^(Name|Uid|Gid):" /proc/1/status 2>&1 || true)"
          annotate "config dir" "$(ls -lan /tmp/pc/config 2>&1)"
      - name: Refuses to run as root
        run: |
          if docker run --rm -e PUID=0 -e PGID=0 periodicool:ci; then
            echo "container started with PUID 0" >&2
            exit 1
          fi
