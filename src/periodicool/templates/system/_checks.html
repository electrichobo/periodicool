{% import "_macros.html" as ui %}
<div class="table-wrap">
  <table class="table">
    <thead><tr><th scope="col">Status</th><th scope="col">Check</th><th scope="col">Message</th><th scope="col">How to fix</th></tr></thead>
    <tbody>
      {% for c in checks %}
      <tr>
        <td>{{ ui.led(c.kind if c.kind != "info" else "off", c.label) }}</td>
        <td>{{ c.name }}</td>
        <td class="wrap">{{ c.message }}</td>
        <td class="wrap">{{ c.fix }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
